datasets:
  - id: esg_company_data
    description: Company-level ESG scores and pillar values used to align ESG targets/features to sectors or industries.
    expected_path: ${ESG_DATA_PATH:-data/external/esg/esg_scores.csv}
    provider: User-supplied ESG data provider
    format: csv
    required: true
    used_by:
      - ESG Analysis final ver.ipynb
      - API added ver5.ipynb
      - Heterophily ver6.ipynb
      - time series ver9.ipynb
      - scripts/run_pipeline.py
      - src/data/preprocessing.py
