title = "ESG Analysis with GNNs Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "newsapi-non-empty-assignment"
description = "Detect non-empty NewsAPI credential assignments in notebooks, scripts, docs, and env files."
regex = '''(?i)(news[_-]?api[_-]?key|newsapi[_-]?key|api[_-]?key)\s*[:=]\s*["']?([A-Za-z0-9_\-]{20,})["']?'''
secretGroup = 2
keywords = ["news", "api", "key", "newsapi", "NEWS_API_KEY"]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Allow only the non-reversible NewsAPI SHA-256 fingerprint used by the security checker."
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''KNOWN_NEWSAPI_SHA256\s*=\s*["'][0-9a-f]{64}["']'''
  ]
  paths = [
    '''^scripts/security_inventory_check\.py$''',
    '''^tests/test_security_inventory\.py$'''
  ]
