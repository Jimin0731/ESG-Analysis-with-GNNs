<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">ESG directed economic graph research pipeline</title>
  <desc id="desc">A schematic from external data through alignment, graph snapshots, leakage-aware features and targets, chronological evaluation, model comparison, and descriptive interpretation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1630"/><stop offset="1" stop-color="#173255"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#21b6a8"/><stop offset="1" stop-color="#5ad3c5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020713" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#75d9ce"/></marker>
    <style>.heading{font:700 30px system-ui,sans-serif;fill:#f4f8ff}.sub{font:15px system-ui,sans-serif;fill:#afc0da}.box{fill:#152b4b;stroke:#496887;stroke-width:1.5}.box2{fill:#123d4a;stroke:#42bcae;stroke-width:1.5}.label{font:700 17px system-ui,sans-serif;fill:#f4f8ff}.detail{font:14px system-ui,sans-serif;fill:#bed0e7}.tiny{font:13px system-ui,sans-serif;fill:#92a9c8}.arrow{fill:none;stroke:#75d9ce;stroke-width:3;marker-end:url(#arrow)}.warn{font:600 14px system-ui,sans-serif;fill:#ffe28a}</style>
  </defs>
  <rect width="1200" height="610" rx="26" fill="url(#bg)"/>
  <text x="54" y="58" class="heading">From economic relationships to honest evaluation</text>
  <text x="54" y="88" class="sub">Active pipeline overview · directed edges stay directed · real datasets remain outside Git</text>

  <g filter="url(#shadow)">
    <rect x="54" y="140" width="190" height="142" rx="18" class="box"/>
    <text x="78" y="176" class="label">1 · Inputs</text>
    <text x="78" y="207" class="detail">ESG observations</text><text x="78" y="231" class="detail">USE/MAKE or ICIO</text><text x="78" y="255" class="detail">macro/environment</text>

    <rect x="286" y="140" width="190" height="142" rx="18" class="box"/>
    <text x="310" y="176" class="label">2 · Align</text>
    <text x="310" y="207" class="detail">typed contracts</text><text x="310" y="231" class="detail">industry mapping</text><text x="310" y="255" class="detail">provenance reports</text>

    <rect x="518" y="140" width="190" height="142" rx="18" class="box2"/>
    <text x="542" y="176" class="label">3 · Graph snapshots</text>
    <circle cx="566" cy="222" r="10" fill="#5ad3c5"/><circle cx="620" cy="210" r="10" fill="#5ad3c5"/><circle cx="660" cy="246" r="10" fill="#5ad3c5"/>
    <path d="M576 220 L608 212 M628 216 L652 239 M652 246 L578 226" class="arrow" stroke-width="2"/>
    <text x="542" y="268" class="tiny">source → target, weighted</text>

    <rect x="750" y="140" width="190" height="142" rx="18" class="box"/>
    <text x="774" y="176" class="label">4 · Features/targets</text>
    <text x="774" y="207" class="detail">train-only transforms</text><text x="774" y="231" class="detail">observed vs derived</text><text x="774" y="255" class="detail">leakage audit</text>

    <rect x="982" y="140" width="164" height="142" rx="18" class="box"/>
    <text x="1006" y="176" class="label">5 · Time split</text>
    <rect x="1006" y="208" width="55" height="15" rx="7" fill="#25b7a4"/><rect x="1066" y="208" width="31" height="15" rx="7" fill="#e5b95c"/><rect x="1102" y="208" width="20" height="15" rx="7" fill="#d56c7f"/>
    <text x="1006" y="251" class="tiny">train · val · test</text>
  </g>
  <path d="M244 211 L278 211" class="arrow"/><path d="M476 211 L510 211" class="arrow"/><path d="M708 211 L742 211" class="arrow"/><path d="M940 211 L974 211" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="190" y="355" width="350" height="136" rx="20" class="box2"/>
    <text x="218" y="393" class="label">6 · Compare models</text>
    <text x="218" y="424" class="detail">train mean · MLP · GCN · GAT · weighted GAT</text>
    <text x="218" y="449" class="detail">bidirectional GNN · GPR-GNN · EconomicGAE*</text>
    <text x="218" y="475" class="tiny">*EconomicGAE is a separate anomaly workflow</text>

    <rect x="660" y="355" width="350" height="136" rx="20" class="box"/>
    <text x="688" y="393" class="label">7 · Report with boundaries</text>
    <text x="688" y="424" class="detail">MAE / RMSE / R² · saved configuration</text>
    <text x="688" y="449" class="detail">attention / perturbation · anomaly scores</text>
    <text x="688" y="475" class="tiny">descriptive associations, never causal estimates</text>
  </g>
  <path d="M1064 291 C1064 326 934 323 934 347" class="arrow"/><path d="M652 423 L548 423" class="arrow" marker-start="url(#arrow)" marker-end="none"/><path d="M548 423 L652 423" class="arrow"/>
  <text x="600" y="558" text-anchor="middle" class="warn">Schematic only · synthetic smoke success is not real-data scientific validation</text>
</svg>
