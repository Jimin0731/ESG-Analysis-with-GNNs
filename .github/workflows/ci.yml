name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall src scripts tests
      - name: Run tests
        run: python -m pytest tests
      - name: Run security inventory check
        run: python scripts/security_inventory_check.py
      - name: Run smoke pipeline
        run: python scripts/run_pipeline.py --smoke-test --epochs 2 --hidden-dim 8
