name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks-pr:
    name: Gitleaks pull request scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks PR scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  gitleaks-current-tree:
    name: Gitleaks current tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Gitleaks CLI with checksum verification
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --output "${asset}" "${base_url}/${asset}"
          curl --fail --silent --show-error --location --output "${checksums}" "${base_url}/${checksums}"
          grep " ${asset}$" "${checksums}" | sha256sum --check --status
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run current-tree Gitleaks scan
        run: gitleaks dir . --redact --config .gitleaks.toml --exit-code 1
