[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-analysis-with-gnns"
version = "0.1.0"
description = "Directed economic-graph research code for ESG-related prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "networkx>=3.1",
  "torch>=2.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0",
  "nbformat>=5.9",
  "nbclient>=0.8",
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["src*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
